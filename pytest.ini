[pytest]
# Los tests viven en tests/ y los modulos del proyecto en python/. `pythonpath`
# ahorra tener que pasar `-t .` como en unittest; `tests/__init__.py` hace lo
# mismo por su cuenta, asi que los dos runners funcionan sin configuracion.
testpaths = tests
pythonpath = python
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `fake_unity_client.py` no es un test, es un cliente de mentira que se lanza a
# mano contra un servidor de verdad.
norecursedirs = __pycache__ .git results

addopts = --strict-markers --tb=short
